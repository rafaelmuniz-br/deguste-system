<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Deguste</title>
<style>
  :root {
    --bg: #faf7f2; --panel: #ffffff; --text: #241c15; --muted: #6f6357; --line: #e6dfd5;
    --accent: #c2410c; --accent-soft: #fdeadd; --ok: #15803d; --code: #f3eee6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17130f; --panel: #211b15; --text: #f1ebe2; --muted: #a89c8c; --line: #362d24;
      --accent: #fb923c; --accent-soft: #3a2415; --ok: #4ade80; --code: #2a231b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 16px; border-right: 1px solid var(--line); background: var(--panel); }
  aside h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line); background: transparent; color: var(--text); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .tabs button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .overall { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
  .overall b { font-size: 26px; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--ok); }
  nav a { display: block; text-decoration: none; color: var(--text); padding: 7px 8px; border-radius: 8px; font-size: 14px; line-height: 1.3; }
  nav a:hover { background: var(--accent-soft); }
  nav a small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  main { padding: 32px 40px 80px; max-width: 980px; }
  .live { font-size: 12px; color: var(--muted); margin-top: 16px; }
  .live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  h1, h2, h3 { line-height: 1.25; scroll-margin-top: 16px; }
  main h1 { font-size: 30px; }
  main h2 { font-size: 22px; margin-top: 2.2em; padding-top: .6em; border-top: 1px solid var(--line); }
  main h3 { font-size: 17px; margin-top: 1.6em; }
  a { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 1em 0; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--code); }
  code { background: var(--code); padding: 1px 5px; border-radius: 5px; font-size: .9em; }
  pre { background: var(--code); padding: 14px; border-radius: 10px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 1em 0; padding: 8px 16px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
  blockquote p { margin: 4px 0; }
  ul:has(> li > input[type=checkbox]) { list-style: none; padding-left: 4px; }
  li > input[type=checkbox] { margin-right: 8px; accent-color: var(--ok); }
  li:has(> input:checked) { color: var(--muted); text-decoration: line-through; }
  .mermaid { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; margin: 1em 0; }
  .err { color: #dc2626; }
  /* etiquetas e cartões de tarefa */
  code.chip, .chip { display: inline-block; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-left: 6px; font-family: inherit; }
  code.chip.dep { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 500; }
  nav a.pessoa.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; margin: 12px 0; }
  summary { cursor: pointer; padding: 10px 0; }
  ul.tarefas { list-style: none; margin: 0; padding: 0 0 8px; }
  .tarefa { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .tarefa.feita { color: var(--muted); }
  .tid { flex: none; min-width: 2.6em; font-weight: 700; color: var(--accent); }
  .meta { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .meta .chip { margin-left: 0; }
  .est { font-size: 13px; font-weight: 600; padding: 1px 8px; border-radius: 6px; }
  .est.livre { background: var(--ok); color: #fff; }
  .est.bloq { background: var(--code); color: var(--muted); }
  .est.ok { color: var(--ok); }
  .pend { background: var(--accent-soft); border-radius: 12px; padding: 4px 16px 10px; margin: 16px 0; }
  .pend h3 { margin-bottom: 4px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 20px 16px 60px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>🍔 Deguste Burguer</h1>
    <div class="sub">Painel de acompanhamento da produção</div>
    <div class="tabs" id="tabs"></div>
    <div class="overall" id="overall"></div>
    <nav id="nav"></nav>
    <div class="live" id="live">atualização automática</div>
  </aside>
  <main id="content">Carregando…</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
const TAREFAS = "@tarefas"; // aba virtual: lê o plano e mostra as tarefas por pessoa
const DOCS = [
  { file: TAREFAS, label: "Minhas tarefas", fonte: "PLANO-DE-PRODUCAO.md" },
  { file: "PLANO-DE-PRODUCAO.md", label: "Plano completo" },
  { file: "Sistema-Deguste-Burguer-Planejamento.md", label: "Planejamento" },
];
const PESSOAS = ["Lucas", "Rafael", "Bruno", "Todos"];
const fonte = (file) => DOCS.find((d) => d.file === file)?.fonte || file;
let current = localStorage.getItem("doc") || DOCS[0].file;
if (!DOCS.some((d) => d.file === current)) current = DOCS[0].file;
let pessoa = localStorage.getItem("pessoa") || "Todos";
if (!PESSOAS.includes(pessoa)) pessoa = "Todos";
let lastMtime = null;

const $ = (id) => document.getElementById(id);
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });

function slug(s, i) {
  return "s" + i + "-" + s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

// Progresso por seção H2, contando checkboxes "- [ ]" / "- [x]" fora de blocos de código.
function progress(md) {
  const sections = [];
  let cur = null, fence = false;
  for (const line of md.split("\n")) {
    if (line.startsWith("```")) fence = !fence;
    if (fence) continue;
    const h = line.match(/^## (.+)/);
    if (h) { cur = { title: h[1], done: 0, total: 0 }; sections.push(cur); continue; }
    const c = line.match(/^\s*- \[([ xX])\]/);
    if (c && cur) { cur.total++; if (c[1] !== " ") cur.done++; }
  }
  return sections;
}

function renderSide(md) {
  $("tabs").innerHTML = DOCS.map((d) =>
    `<button class="${d.file === current ? "on" : ""}" data-f="${d.file}">${d.label}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) => b.onclick = () => {
    current = b.dataset.f; localStorage.setItem("doc", current); lastMtime = null; load();
  });

  if (current === TAREFAS) {
    const todas = parseTarefas(md);
    const resumo = (p) => {
      const t = todas.filter((x) => p === "Todos" || x.donos.includes(p));
      return { done: t.filter((x) => x.feito).length, total: t.length };
    };
    const r = resumo(pessoa), pct = r.total ? Math.round((r.done / r.total) * 100) : 0;
    $("overall").innerHTML = `<b>${pct}%</b> <span class="sub">${r.done} de ${r.total} tarefas${pessoa === "Todos" ? " do projeto" : " de " + pessoa}</span><div class="bar"><i style="width:${pct}%"></i></div>`;
    $("nav").innerHTML = `<div class="sub" style="margin-bottom:6px">Quem é você?</div>` + PESSOAS.map((p) => {
      const x = resumo(p);
      return `<a href="#" data-p="${p}" class="pessoa ${p === pessoa ? "on" : ""}">${p}<small>${x.done}/${x.total} tarefas</small></a>`;
    }).join("");
    $("nav").querySelectorAll("a.pessoa").forEach((a) => a.onclick = (e) => {
      e.preventDefault(); pessoa = a.dataset.p; localStorage.setItem("pessoa", pessoa); load();
    });
    return;
  }

  const secs = progress(md);
  const tasks = secs.filter((s) => s.title.startsWith("Fase ") && s.total > 0);
  const done = tasks.reduce((a, s) => a + s.done, 0), total = tasks.reduce((a, s) => a + s.total, 0);
  const pct = total ? Math.round((done / total) * 100) : 0;
  $("overall").innerHTML = total
    ? `<b>${pct}%</b> <span class="sub">${done} de ${total} tarefas das fases</span><div class="bar"><i style="width:${pct}%"></i></div>`
    : `<span class="sub">Documento sem checklist de tarefas</span>`;

  $("nav").innerHTML = secs.map((s, i) => {
    const p = s.total ? `<small>${s.done}/${s.total} tarefas</small><div class="bar"><i style="width:${(s.done / s.total) * 100}%"></i></div>` : "";
    return `<a href="#${slug(s.title, i)}">${s.title}${p}</a>`;
  }).join("");
}

// Lê as tarefas numeradas ("- [ ] 1.8 texto `👤 Lucas` `⏳ depende: 1.7`") das seções "## Fase N".
function parseTarefas(md) {
  const tarefas = [];
  let fase = null, fence = false;
  for (const line of md.split("\n")) {
    if (line.startsWith("```")) fence = !fence;
    if (fence) continue;
    if (line.startsWith("## ")) { fase = /^## (Fase \d+ .+)/.test(line) ? line.slice(3) : null; continue; }
    const m = line.match(/^- \[([ xX])\] (\d+\.\d+) (.*)$/);
    if (!m || !fase) continue;
    const dono = m[3].match(/`👤 ([^`]+)`/), dep = m[3].match(/`⏳ depende: ([^`]+)`/);
    tarefas.push({
      id: m[2], feito: m[1] !== " ", fase,
      texto: m[3].replace(/\s*`(?:👤|⏳)[^`]*`/g, ""),
      donos: dono ? dono[1].split(" + ") : [],
      deps: dep ? dep[1].split(", ") : [],
    });
  }
  return tarefas;
}

// Pendências da seção "Decisões e informações pendentes": | P2 | texto | Lucas | bloqueia |
function parsePendencias(md) {
  return md.split("\n").flatMap((l) => {
    const m = l.match(/^\| (P\d+) \| (.+?) \| (.+?) \| (.+?) \|$/);
    return m && !m[2].includes("✅") ? [{ id: m[1], texto: m[2], quem: m[3], bloqueia: m[4] }] : [];
  });
}

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderTarefas(md) {
  const todas = parseTarefas(md);
  const feitas = new Set(todas.filter((t) => t.feito).map((t) => t.id));
  const porId = Object.fromEntries(todas.map((t) => [t.id, t]));
  const minhas = todas.filter((t) => pessoa === "Todos" || t.donos.includes(pessoa));
  const abertas = minhas.filter((t) => !t.feito);
  const bloqueada = (t) => t.deps.filter((d) => !feitas.has(d));
  // Só as 3 fases mais próximas contam como "para agora"; as demais são futuras.
  const numFase = (t) => Number(t.fase.match(/Fase (\d+)/)?.[1] ?? 99);
  const faseMin = Math.min(...todas.filter((t) => !t.feito).map(numFase));
  const futura = (t) => !t.feito && numFase(t) > faseMin + 2;

  const card = (t) => {
    const falta = bloqueada(t);
    const estado = t.feito ? `<span class="est ok">✔ feita</span>`
      : futura(t) ? `<span class="est bloq">🔒 fase futura</span>`
      : falta.length ? `<span class="est bloq">⏳ aguardando ${falta.map((d) => `${d} (${esc((porId[d]?.texto || "").replace(/\*/g, "").slice(0, 32))}…)`).join(", ")}</span>`
      : `<span class="est livre">▶ pode começar</span>`;
    const com = t.donos.filter((d) => d !== pessoa);
    return `<li class="tarefa ${t.feito ? "feita" : ""}">
      <span class="tid">${t.id}</span>
      <div><div>${marked.parseInline(t.texto)}</div>
      <div class="meta">${estado}${pessoa === "Todos" ? t.donos.map((d) => `<span class="chip">👤 ${d}</span>`).join("") : (com.length ? `<span class="chip">com ${com.join(", ")}</span>` : "")}</div></div>
    </li>`;
  };

  const fases = [...new Set(minhas.map((t) => t.fase))];
  let abertasMostradas = 0;
  const blocos = fases.map((f) => {
    const ts = minhas.filter((t) => t.fase === f);
    const pend = ts.filter((t) => !t.feito).length;
    const abrir = pend > 0 && abertasMostradas < 2;
    if (pend > 0) abertasMostradas++;
    return `<details ${abrir ? "open" : ""}><summary><b>${esc(f)}</b> <span class="sub" style="margin:0">— ${ts.length - pend}/${ts.length} feitas</span></summary>
      <ul class="tarefas">${ts.map(card).join("")}</ul></details>`;
  }).join("");

  const agora = abertas.filter((t) => bloqueada(t).length === 0 && !futura(t)).length;
  const pend = parsePendencias(md).filter((p) => pessoa === "Todos" || p.quem.includes(pessoa));

  $("content").innerHTML = `
    <h1>${pessoa === "Todos" ? "Todas as tarefas" : "Tarefas de " + pessoa}</h1>
    <p class="sub">${abertas.length ? `${abertas.length} em aberto · <b>${agora}</b> já podem ser começadas.` : "Nada em aberto. 🎉"}
      Escolha quem você é na lateral. Tarefas com <code>▶ pode começar</code> não dependem de mais ninguém.</p>
    ${pend.length ? `<div class="pend"><h3>❓ Informações que faltam de ${pessoa === "Todos" ? "todos" : "você"}</h3><ul>${pend.map((p) =>
      `<li><b>${p.id}</b> — ${marked.parseInline(p.texto)} <span class="sub" style="margin:0">(${esc(p.quem)} · destrava ${esc(p.bloqueia)})</span></li>`).join("")}</ul></div>` : ""}
    ${blocos}`;
}

async function renderMain(md) {
  if (current === TAREFAS) return renderTarefas(md);
  $("content").innerHTML = marked.parse(md);
  // etiquetas de responsável/dependência viram "chips"
  $("content").querySelectorAll("code").forEach((c) => {
    if (c.textContent.startsWith("👤")) c.className = "chip";
    else if (c.textContent.startsWith("⏳")) c.className = "chip dep";
  });
  // ids de âncora nos H2 (mesma ordem usada na navegação)
  let i = 0;
  $("content").querySelectorAll("h2").forEach((h) => { h.id = slug(h.textContent, i++); });
  // links externos em nova aba; .md locais viram abas do painel
  $("content").querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    const doc = DOCS.find((d) => href === d.file);
    if (doc) { a.onclick = (e) => { e.preventDefault(); current = doc.file; localStorage.setItem("doc", current); lastMtime = null; load(); }; }
    else if (/^https?:/.test(href)) a.target = "_blank";
  });
  // mermaid
  const blocks = $("content").querySelectorAll("pre code.language-mermaid");
  blocks.forEach((c) => { const d = document.createElement("div"); d.className = "mermaid"; d.textContent = c.textContent; c.parentElement.replaceWith(d); });
  if (blocks.length && window.mermaid) { try { await mermaid.run({ querySelector: ".mermaid" }); } catch (e) { console.warn(e); } }
}

async function load() {
  try {
    const r = await fetch("/doc/" + encodeURIComponent(fonte(current)));
    lastMtime = r.headers.get("X-Mtime");
    const md = await r.text();
    const y = window.scrollY;
    renderSide(md);
    await renderMain(md);
    window.scrollTo(0, y);
    $("live").textContent = "atualizado às " + new Date().toLocaleTimeString("pt-BR") + " · atualização automática";
  } catch (e) {
    $("content").innerHTML = `<p class="err">Erro ao carregar: ${e.message}</p>`;
  }
}

setInterval(async () => {
  try {
    const m = await (await fetch("/api/mtime")).json();
    if (lastMtime !== null && String(m[fonte(current)]) !== String(lastMtime)) load();
  } catch (e) { $("live").textContent = "servidor offline"; }
}, 2000);

load();
</script>
</body>
</html>
