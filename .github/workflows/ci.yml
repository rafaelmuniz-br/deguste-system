name: CI

on:
  pull_request:
    # 'edited' para reconferir quando alguém corrige o texto do PR (ex.: acrescenta "Fecha: 1.8")
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  banco:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci
      # Aplica todas as migrations + seed num Postgres em memória e testa RLS e regras de integridade.
      - run: npm test

  plano:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/plano.test.mjs
      # Formato do plano e, em PR, se as tarefas que ele diz fechar estão marcadas [x].
      - run: node scripts/verificar-plano.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
